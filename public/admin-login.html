<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Quest — Conductor Login</title>
<link rel="stylesheet" href="/css/main.css"/>
<link rel="stylesheet" href="/css/auth.css"/>
</head>
<body>
<canvas id="star-canvas"></canvas>
<div class="auth-page page-enter">
  <div class="auth-brand">
    <a href="/" class="brand-link">
      <span>🤖</span>
      <span class="text-gradient">AI Quest</span>
    </a>
  </div>
  <div class="auth-container">
    <div style="text-align:center;margin-bottom:24px">
      <div style="font-size:2.5rem;margin-bottom:8px">🎓</div>
      <h2 class="auth-title">Conductor Login</h2>
      <p class="auth-sub">Access the leaderboard and participant results</p>
    </div>
    <div id="admin-alert"></div>
    <form onsubmit="handleAdminLogin(event)">
      <div class="form-group">
        <label for="admin-email">Admin Email</label>
        <input id="admin-email" class="form-input" type="email" placeholder="admin@aiquest.com" required autocomplete="username"/>
      </div>
      <div class="form-group">
        <label for="admin-password">Password</label>
        <input id="admin-password" class="form-input" type="password" placeholder="Admin password" required autocomplete="current-password"/>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;" id="admin-btn">
        🔐 Login as Conductor
      </button>
    </form>
    <p style="text-align:center;margin-top:16px"><a href="/" style="color:var(--text-muted);font-size:0.85rem">← Back to Home</a></p>
  </div>
</div>
<script src="/js/api.js"></script>
<script>
  initStars();
  // Redirect if already admin-logged-in
  const u = getUser(); const t = getToken();
  if (t && u && u.role === 'admin') window.location.href = '/admin.html';

  async function handleAdminLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('admin-btn');
    btn.disabled = true; btn.textContent = '⏳ Verifying...';
    try {
      const data = await apiRequest('POST', '/auth/admin/login', {
        email: document.getElementById('admin-email').value,
        password: document.getElementById('admin-password').value
      }, false);
      setToken(data.token);
      setUser({ ...data.user, role: 'admin' });
      window.location.href = '/admin.html';
    } catch (err) {
      document.getElementById('admin-alert').innerHTML =
        `<div class="alert alert-error">${err.message}</div>`;
      btn.disabled = false; btn.textContent = '🔐 Login as Conductor';
    }
  }
</script>
</body>
</html>
