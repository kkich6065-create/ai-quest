<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Quest — Quiz</title>
<link rel="stylesheet" href="/css/main.css"/>
<link rel="stylesheet" href="/css/quiz.css"/>
</head>
<body>
<canvas id="star-canvas"></canvas>

<!-- QUIZ HEADER -->
<header class="quiz-header">
  <div class="qh-left">
    <span class="qh-logo">🤖 AI Quest</span>
  </div>
  <div class="qh-center">
    <div class="timer-display" id="timer">⏱️ 00:00</div>
  </div>
  <div class="qh-right">
    <span id="qh-user">👤</span>
    <div class="round-indicators">
      <span class="ri" id="ri-1">R1</span>
      <span class="ri-arrow">→</span>
      <span class="ri" id="ri-2">R2</span>
      <span class="ri-arrow">→</span>
      <span class="ri" id="ri-3">R3</span>
    </div>
  </div>
</header>

<!-- ROUND TRANSITION (shown between rounds) -->
<div class="round-transition" id="round-transition" style="display:none">
  <div class="rt-content page-enter">
    <div id="rt-emoji" style="font-size:5rem;margin-bottom:16px">🎉</div>
    <h2 id="rt-title">Round Complete!</h2>
    <p id="rt-subtitle" class="rt-sub"></p>
    <div class="rt-score-card">
      <div id="rt-score-label">Round Score</div>
      <div id="rt-score-value" class="rt-big-score">0</div>
    </div>
    <p id="rt-msg" class="rt-msg"></p>
    <button class="btn btn-primary btn-lg" id="rt-btn" onclick="continueToNextRound()">Continue →</button>
  </div>
</div>

<!-- MAIN QUIZ AREA -->
<main class="quiz-main" id="quiz-main">
  <div class="quiz-container">

    <!-- Progress bar -->
    <div class="progress-bar-wrap">
      <div class="progress-labels">
        <span id="prog-label">Round 1 — Easy</span>
        <span id="prog-count">1 / 10</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <!-- Question -->
    <div class="question-card card" id="question-card">
      <div class="q-meta">
        <span class="q-number" id="q-number">Question 1</span>
        <span id="q-badge" class="badge badge-easy">EASY</span>
      </div>
      <p class="q-text" id="q-text">Loading question...</p>
      <div class="options-grid" id="options-grid">
        <button class="option-btn" id="opt-A" onclick="selectOption('A')"><span class="opt-letter">A</span><span class="opt-text"></span></button>
        <button class="option-btn" id="opt-B" onclick="selectOption('B')"><span class="opt-letter">B</span><span class="opt-text"></span></button>
        <button class="option-btn" id="opt-C" onclick="selectOption('C')"><span class="opt-letter">C</span><span class="opt-text"></span></button>
        <button class="option-btn" id="opt-D" onclick="selectOption('D')"><span class="opt-letter">D</span><span class="opt-text"></span></button>
      </div>
      <div class="q-nav">
        <button class="btn btn-secondary" id="prev-btn" onclick="navigate(-1)">← Previous</button>
        <div id="submit-round-wrap">
          <button class="btn btn-primary" id="next-btn" onclick="navigate(1)">Next →</button>
          <button class="btn btn-success" id="submit-round-btn" style="display:none" onclick="showSubmitRoundModal()">Submit Round ✓</button>
        </div>
      </div>
    </div>

    <!-- Question Navigator -->
    <div class="q-navigator" id="q-navigator"></div>

  </div>
</main>

<!-- Submit Round Modal -->
<div class="modal-overlay" id="submit-round-modal">
  <div class="modal">
    <div style="font-size:2.5rem;margin-bottom:12px" id="sr-modal-emoji">⚠️</div>
    <h3 id="sr-modal-title">Submit Round?</h3>
    <p id="sr-modal-msg" style="color:var(--text-secondary);margin:12px 0 24px"></p>
    <div style="display:flex;gap:12px;justify-content:center">
      <button class="btn btn-secondary" onclick="closeSubmitModal()">Review Answers</button>
      <button class="btn btn-primary" id="sr-confirm-btn" onclick="submitRound()">Confirm Submit ✓</button>
    </div>
  </div>
</div>

<!-- Final Submit Modal -->
<div class="modal-overlay" id="final-submit-modal">
  <div class="modal">
    <div style="font-size:3rem;margin-bottom:12px">🏆</div>
    <h3>Submit Final Quiz?</h3>
    <p style="color:var(--text-secondary);margin:12px 0 24px">This will end your quiz and record your final score. You cannot change answers after this.</p>
    <div style="display:flex;gap:12px;justify-content:center">
      <button class="btn btn-secondary" onclick="document.getElementById('final-submit-modal').classList.remove('active')">Review</button>
      <button class="btn btn-danger" onclick="submitFinal()">🏁 Submit Final Quiz</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/quiz.js"></script>
</body>
</html>
