services:
  - type: web
    name: ai-quest
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@aiquest.com
      - key: ADMIN_PASSWORD
        value: Admin@123
